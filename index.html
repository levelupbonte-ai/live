<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Grand Duel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        
        body { 
            background-color: #0f172a; /* Bleu nuit très pro */
            color: #fff; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        /* --- ÉCRAN 1 : LE CHOIX --- */
        #choice-screen {
            text-align: center;
            transition: opacity 0.8s ease;
            z-index: 20;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .title {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            background: linear-gradient(90deg, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .players-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }

        .player-card {
            flex: 1;
            background: #1e293b;
            border-radius: 16px;
            padding: 15px;
            border: 1px solid #334155;
            transition: transform 0.3s;
        }

        .player-card:hover {
            transform: translateY(-5px);
        }

        .player-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            object-fit: cover;
            object-position: top;
            margin-bottom: 15px;
            background-color: #000;
        }

        .btn-choice {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn-choice:active {
            transform: scale(0.98);
        }

        .btn-messi {
            background: #3b82f6; /* Bleu Argentine */
        }

        .btn-ronaldo {
            background: #ef4444; /* Rouge Portugal */
        }

        /* --- ÉCRAN 2 : LE PIÈGE --- */
        #trap-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            opacity: 0;
            transition: opacity 1.5s ease;
            background-color: #000;
            overflow: hidden;
        }

        /* L'image de fond (la première image que tu m'as envoyée) */
        #trap-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(2px) brightness(0.6); /* Légèrement floutée et assombrie pour faire ressortir le texte */
            transform: scale(1.05); /* Évite les bords blancs du flou */
            animation: zoomEffect 20s infinite alternate linear;
        }

        /* Petit effet de zoom très lent pour rendre l'image "vivante" et flippante */
        @keyframes zoomEffect {
            from { transform: scale(1.05); }
            to { transform: scale(1.1); }
        }

        /* Le contenu par-dessus */
        .trap-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 10vh;
            background: rgba(0, 0, 0, 0.3); /* Assombrit un peu plus */
        }

        .mocking-text {
            font-size: 40px;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            line-height: 1.2;
            padding: 0 20px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            animation: pulseText 2s infinite alternate;
        }

        .mocking-subtext {
            font-size: 20px;
            color: #cbd5e1;
            margin-top: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        @keyframes pulseText {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.02); opacity: 1; }
        }

        /* Responsive pour les petits écrans */
        @media (max-width: 600px) {
            .players-container {
                flex-direction: column;
                gap: 15px;
            }
            .player-img {
                aspect-ratio: 16 / 9;
            }
            .title { font-size: 24px; margin-bottom: 20px; }
            .mocking-text { font-size: 28px; }
            .mocking-subtext { font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- ÉCRAN 1 : LE CHOIX -->
    <div id="choice-screen">
        <h1 class="title">Fais ton choix</h1>
        
        <div class="players-container">
            <!-- Messi -->
            <div class="player-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQqeDOotXbibZJMbqpanPElfDcJt12-_oHya2smxFv47w&s=10" alt="Messi" class="player-img">
                <button class="btn-choice btn-messi" onclick="triggerTrap()">MESSI</button>
            </div>

            <!-- Ronaldo -->
            <div class="player-card">
                <img src="https://sportal365images.com/process/smp-images-production/assets/25032026/fbfe5a1e-34db-4636-bd28-7bded417cc10.png?operations=crop(147:0:1332:1185)" alt="Ronaldo" class="player-img">
                <button class="btn-choice btn-ronaldo" onclick="triggerTrap()">RONALDO</button>
            </div>
        </div>
    </div>

    <!-- ÉCRAN 2 : LE PIÈGE -->
    <div id="trap-screen">
        <!-- L'image de fond est maintenant fixe -->
        <img id="trap-bg" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSudE-SyrOa1RmhS07N9ZYrQsU32AOlagza4mU3q2HG4KhwMmr3n1-7EFU&s=10" alt="Trap">
        
        <div class="trap-content">
            <h2 class="mocking-text">Dans la vie,<br>il faut savoir faire<br>les bons choix.</h2>
            <p class="mocking-subtext">La curiosité est un vilain défaut...</p>
        </div>
    </div>

    <!-- TON AUDIO -->
    <audio id="trap-audio" loop>
        <source src="https://files.catbox.moe/5uhagm.mp3" type="audio/mpeg">
    </audio>

    <script>
        const choiceScreen = document.getElementById('choice-screen');
        const trapScreen = document.getElementById('trap-screen');
        const audio = document.getElementById('trap-audio');

        // La fonction ne prend plus d'argument "player", elle fait toujours la même chose
        function triggerTrap() {
            // 1. Lancer la musique à fond
            audio.volume = 1.0; 
            audio.play().catch(e => console.log("Erreur audio : ", e));

            // 2. Faire la transition
            choiceScreen.style.opacity = '0';
            
            setTimeout(() => {
                choiceScreen.style.display = 'none';
                trapScreen.style.display = 'block';
                
                setTimeout(() => {
                    trapScreen.style.opacity = '1';
                }, 50);
            }, 800);
        }

        // Empêcher le clic droit
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Bloquer la barre d'espace pour pas qu'ils puissent couper le son
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
            }
        });

        // --- 🚨 ASTUCE SECRÈTE PRÉSENTATEUR 🚨 ---
        // Appuie 3 fois sur Échap pour couper le son
        let escPressCount = 0;
        let escTimer;

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                escPressCount++;
                
                if (escPressCount === 1) {
                    escTimer = setTimeout(() => { escPressCount = 0; }, 1000);
                }
                
                if (escPressCount === 3) {
                    clearTimeout(escTimer);
                    audio.pause();
                    audio.currentTime = 0;
                    console.log("🔇 Mode Présentateur : Audio coupé.");
                    escPressCount = 0;
                }
            }
        });
    </script>
</body>
</html>
